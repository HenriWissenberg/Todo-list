<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Todo List</title>
    <link rel="icon" type="image/x-icon" href="resources/images/owl-icon.png">
</head>
<body>
    <nav class="navbar navbar_background_color px-4">
        <div class="container-fluid d-flex align-items-center">

            <div class="d-flex align-items-center">
                <img
                        src="resources/images/owl-icon-banner.png"
                        alt="Todo Owl Logo Banner"
                        class="app-logo"
                >
            </div>

            <div class="ms-auto text-end">
                <div id="currentDate"></div>
                <div id="currentTime"></div>
            </div>
        </div>
    </nav>

    <div class="container rounded-3 list_background_color p-3 mt-4">
        <div id="TodoList" class="container-lg mt-4">
            <div id="display_notes">
                <div id="accordion_list" class="accordion">
                </div>
            </div>

            <form id="todo_form" class="mt-4">
                <div id="todo_name" class="input-group mb-3">
                    <label for="todo_name_input"></label>
                    <input id="todo_name_input" type="text" class="form-control" aria-label="Text field" placeholder="Enter the name of the category of the Todos here">
                </div>

                <div id="text_field" class="input-group">
                    <label for="text_field_input"></label>
                    <textarea id="text_field_input" type="text" class="form-control" aria-label="Text field" placeholder="Enter your Todos here"></textarea>
                </div>

                <div class="input-group mb-3 mt-3">
                    <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
                    <button class="btn btn-secondary" type="button" id="inputGroupFileAddon04">Choose file</button>
                </div>

                <div class="d-flex">
                    <button id="submit_button" class="btn btn-primary ms-auto mt-4" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
