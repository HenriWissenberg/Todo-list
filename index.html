<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Todo List</title>
</head>
<body>
    <div class="container mt-5 text-center">
        <h3>Todo list</h3>
    </div>

    <div class="container rounded-2 bg-dark-subtle p-3">
        <div id="TodoList" class="container-lg mt-4">
            <div id="display_notes">
                <div id="accordion_list" class="accordion">
                </div>
            </div>

            <form id="todo_form" class="mt-4">
                <div id="todo_name" class="input-group mb-3">
                    <label for="todo_name_input"></label>
                    <input id="todo_name_input" type="text" class="form-control" aria-label="Text field" placeholder="Enter the name of the category of the Todos here">
                </div>

                <div id="text_field" class="input-group">
                    <label for="text_field_input"></label>
                    <textarea id="text_field_input" type="text" class="form-control" aria-label="Text field" placeholder="Enter your Todos here"></textarea>
                </div>

                <div class="input-group mb-3 mt-3">
                    <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
                    <button class="btn btn-secondary" type="button" id="inputGroupFileAddon04">Choose file</button>
                </div>

                <div class="d-flex">
                    <button class="btn btn-primary ms-auto mt-4" type="submit" id="submit_button">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
